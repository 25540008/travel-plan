<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Điểm đến trong nước · Travelplan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #10302e;
        --pine: #2f6b5c;
        --coral: #d9512c;
        --sun: #f2c25b;
        --lake: #3c7fa0;
        --mist: #e3eee8;
        --bg: #f4f6f2;
        --muted: #4a5e5b;
        --line: #dce3df;
        --card: 20px;
        --ctl: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 14px/1.5 "Be Vietnam Pro",
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3,
      .logo {
        font-family: Lexend, "Be Vietnam Pro", system-ui, sans-serif;
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--lake);
        outline-offset: 2px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Header + hero */
      .hero {
        position: relative;
        background: linear-gradient(#3f6b63, #2f5a52);
        color: #fff;
        overflow: hidden;
      }
      .hero svg.bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hero .wrap {
        position: relative;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-top: 16px;
        padding-bottom: 8px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 18px;
      }
      .logo i {
        font-style: normal;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #fff;
      }
      .nav {
        display: flex;
        gap: 4px;
        flex: 1;
      }
      .nav a {
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 500;
        font-size: 13px;
      }
      .nav a:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .nav a[aria-current="page"] {
        background: rgba(255, 255, 255, 0.28);
      }
      .menu-btn {
        display: none;
        margin-left: auto;
        background: rgba(255, 255, 255, 0.18);
        border: 0;
        border-radius: var(--ctl);
        padding: 8px 12px;
        color: #fff;
        cursor: pointer;
      }
      .auth {
        display: flex;
        gap: 8px;
        align-items: center;
        position: relative;
      }
      .btn {
        display: inline-block;
        border: 0;
        border-radius: var(--ctl);
        padding: 9px 16px;
        font-weight: 600;
        cursor: pointer;
        background: var(--coral);
        color: #fff;
      }
      .btn.ghost {
        background: transparent;
        color: inherit;
        border: 1px solid currentColor;
      }
      .btn.light {
        background: #fff;
        color: var(--ink);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        color: var(--ink);
        font:
          700 13px Lexend,
          sans-serif;
        cursor: pointer;
      }
      .acc {
        position: absolute;
        right: 0;
        top: 44px;
        z-index: 5;
        min-width: 160px;
        background: #fff;
        color: var(--ink);
        border-radius: var(--ctl);
        box-shadow: 0 8px 24px rgba(16, 48, 46, 0.2);
        padding: 6px;
      }
      .acc a,
      .acc button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .acc a:hover,
      .acc button:hover {
        background: var(--mist);
      }
      .hero-body {
        padding: 56px 0 96px;
      }
      .crumb {
        font-size: 12px;
        opacity: 0.85;
        margin-bottom: 16px;
      }
      .crumb a:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 52px;
        line-height: 1.1;
        font-weight: 700;
      }
      .hero p {
        max-width: 540px;
        margin: 16px 0 28px;
        font-size: 15px;
        opacity: 0.92;
      }
      .search {
        position: relative;
        max-width: 560px;
      }
      .search input {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: var(--ctl);
        padding: 0 16px 0 42px;
        background: #fff;
        color: var(--ink);
      }
      .search svg {
        position: absolute;
        left: 14px;
        top: 15px;
      }

      /* Season */
      .season {
        padding-top: 40px;
      }
      .eyebrow {
        color: var(--coral);
        font:
          600 12px Lexend,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h2 {
        font-size: 28px;
        font-weight: 600;
        margin: 4px 0 16px;
      }
      .s-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .s-card {
        display: flex;
        gap: 16px;
        align-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--card);
        padding: 10px;
      }
      .s-card:hover,
      .card:hover {
        border-color: var(--pine);
      }
      .s-card img {
        width: 132px;
        height: 116px;
        border-radius: 14px;
        object-fit: cover;
        flex: none;
      }
      .tag-reason {
        display: inline-block;
        background: #f8e6bd;
        border-radius: 999px;
        padding: 1px 9px;
        font-size: 11px;
        font-weight: 500;
      }
      .s-card h3 {
        font-size: 20px;
        margin: 6px 0 4px;
      }
      .s-card p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      /* Filters */
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin: 32px 0 20px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 13px;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--pine);
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .sort {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .sort select {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: var(--ctl);
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
      }

      /* Cards */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding-bottom: 56px;
      }
      .card {
        display: block;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--card);
        overflow: hidden;
      }
      .c-img {
        position: relative;
        aspect-ratio: 3/2;
        background: var(--mist);
      }
      .c-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pill {
        position: absolute;
        top: 10px;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 600;
      }
      .pill.reg {
        left: 10px;
        background: #fff;
      }
      .pill.now {
        right: 10px;
        background: var(--sun);
      }
      .c-body {
        padding: 16px;
      }
      .c-body h3 {
        font-size: 17px;
      }
      .prov {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .tags {
        display: flex;
        gap: 6px;
        list-style: none;
        padding: 0;
        margin: 10px 0 12px;
      }
      .tags li {
        background: var(--mist);
        border-radius: 999px;
        padding: 1px 9px;
        font-size: 11px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1.5fr 1fr 0.7fr;
        gap: 6px;
        margin: 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .stats dt {
        font-size: 10.5px;
        color: var(--muted);
      }
      .stats dd {
        margin: 0;
        font-weight: 600;
        font-size: 12px;
      }
      .sk {
        height: 300px;
        border-radius: var(--card);
        background: linear-gradient(
          90deg,
          #e9eeea 25%,
          #f6f8f5 50%,
          #e9eeea 75%
        );
        background-size: 200% 100%;
        animation: sh 1.2s infinite;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      .state {
        grid-column: 1/-1;
        text-align: center;
        padding: 48px 16px;
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: var(--card);
      }
      .state p {
        margin: 0 0 14px;
      }
      .wake {
        grid-column: 1/-1;
        text-align: center;
        color: var(--muted);
      }
      footer {
        background: var(--ink);
        color: #cfe0da;
        font-size: 12px;
      }
      footer .wrap {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 18px;
        padding-bottom: 18px;
      }
      footer b {
        font-family: Lexend, sans-serif;
        color: #fff;
      }
      dialog {
        border: 0;
        border-radius: var(--card);
        padding: 24px;
        max-width: 380px;
        box-shadow: 0 16px 48px rgba(16, 48, 46, 0.3);
      }
      dialog::backdrop {
        background: rgba(16, 48, 46, 0.5);
      }
      dialog p {
        margin: 0 0 18px;
        font-weight: 500;
      }
      dialog .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      @media (max-width: 1180px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 1023px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .s-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 767px) {
        .menu-btn {
          display: block;
        }
        .nav {
          display: none;
          order: 5;
          flex-basis: 100%;
          flex-direction: column;
        }
        .nav.open {
          display: flex;
        }
        .top {
          flex-wrap: wrap;
        }
        .auth {
          order: 3;
        }
        h1 {
          font-size: 34px;
        }
        h2 {
          font-size: 23px;
        }
        .hero-body {
          padding: 32px 0 56px;
        }
        .sort {
          width: 100%;
        }
        .chips {
          flex-wrap: nowrap;
          overflow-x: auto;
          width: 100%;
          padding-bottom: 6px;
        }
        .chip {
          flex: none;
        }
      }
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wrap {
          padding: 0 16px;
        }
        footer .wrap {
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <svg
        class="bg"
        viewBox="0 0 1440 440"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
      >
        <rect width="1440" height="440" fill="#6E8A83" />
        <path
          d="M60 300V210Q100 120 150 210V300zM560 300V190Q610 90 660 190V300zM1000 300V200Q1060 110 1110 200V300z"
          fill="#8BA79F"
          opacity=".6"
        />
        <path
          d="M330 300V120Q360 -30 420 60Q470 20 500 130V300zM770 300V90Q800 -20 860 40Q930 10 960 120V300zM1150 300V130Q1200 -10 1290 40Q1400 0 1440 100V300z"
          fill="#2F5C52"
        />
        <path d="M1280 300V170Q1330 90 1440 130V300z" fill="#214D44" />
        <rect y="262" width="1440" height="178" fill="#3C6C66" />
        <rect y="262" width="1440" height="3" fill="#4F807A" />
        <path d="M640 300h130l-65-70zM650 300v70h110v-70z" fill="#7A3B25" />
        <path d="M650 300h110" stroke="#5a2a1a" stroke-width="3" />
        <path
          d="M520 372h340M600 384h240"
          stroke="#6F9A94"
          stroke-width="3"
          opacity=".6"
        />
      </svg>
      <div class="wrap">
        <div class="top">
          <a class="logo" href="/" aria-label="Travelplan, về Trang chủ"
            ><i>🧭</i>travelplan</a
          >
          <button
            class="menu-btn"
            id="menuBtn"
            aria-expanded="false"
            aria-controls="nav"
          >
            Menu
          </button>
          <nav class="nav" id="nav" aria-label="Chính">
            <a href="/">Trang chủ</a>
            <a href="/diem-den" aria-current="page">Điểm đến</a>
            <a href="/lich-trinh-mau">Lịch trình mẫu</a>
            <a href="/chuyen-di" data-auth="1">Chuyến đi của tôi</a>
          </nav>
          <div class="auth" id="auth"></div>
        </div>
        <div class="hero-body">
          <div class="crumb"><a href="/">Trang chủ</a> / Điểm đến</div>
          <h1>Điểm đến trong nước</h1>
          <p>
            Xem nơi nào hợp mùa, đi mấy ngày là vừa, tốn khoảng bao nhiêu, rồi
            mở lịch trình người khác đã đi thật.
          </p>
          <div class="search">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#4A5E5B"
              stroke-width="2.4"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" />
            </svg>
            <label class="sr" for="q">Tìm điểm đến</label>
            <input
              id="q"
              type="search"
              placeholder="Tìm tỉnh, thành phố hoặc vùng"
              maxlength="100"
              autocomplete="off"
            />
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="season" id="season" hidden aria-labelledby="sTitle">
        <div class="eyebrow">Theo mùa</div>
        <h2 id="sTitle"></h2>
        <div class="s-grid" id="sGrid"></div>
      </section>

      <div class="bar">
        <div
          class="chips"
          id="chips"
          role="group"
          aria-label="Lọc điểm đến"
        ></div>
        <div class="sort">
          <label for="sort">Sắp xếp</label>
          <select id="sort">
            <option value="lt">Nhiều lịch trình nhất</option>
            <option value="ten">Tên A–Z</option>
          </select>
        </div>
      </div>
      <p class="sr" id="live" aria-live="polite"></p>
      <div class="grid" id="grid" aria-busy="true"></div>
    </main>

    <footer>
      <div class="wrap">
        <b>travelplan</b
        ><span>© 2026 travelplan · Đi nhiều, tính ít, chơi hết mình.</span>
      </div>
    </footer>
    <dialog id="dlg">
      <p id="dlgMsg"></p>
      <div class="row" id="dlgBtns"></div>
    </dialog>

    <script>
      /* ===== Cấu hình: chỉnh theo dự án ===== */
      const API_BASE = window.TRAVELPLAN_API_BASE || ""; // ví dụ https://xxx.onrender.com
      const TOKEN_KEY = "token"; // khóa JWT (UC 2: localStorage / sessionStorage)
      const ROUTES = {
        home: "/",
        login: "/dang-nhap",
        register: "/dang-ky",
        trips: "/chuyen-di",
        saved: "/da-luu",
        detail: (s) => "/diem-den/" + encodeURIComponent(s), // Screen 4 (do người khác làm)
      };
      const P = new URLSearchParams(location.search);
      // Dữ liệu mẫu (không cần backend) khi: URL có ?mock=1, hoặc mở thẳng file .html từ máy.
      // Tùy chọn khi dùng dữ liệu mẫu: &thang=11 đổi tháng hiện tại, &khach=1 xem chế độ khách.
      const USE_MOCK = P.has("mock") || location.protocol === "file:";

      /* ===== Tiện ích ===== */
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const fold = (s) =>
        String(s || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D")
          .toLowerCase()
          .trim();
      const REGIONS = [
        { k: "mien-bac", l: "Miền Bắc" },
        { k: "mien-trung", l: "Miền Trung" },
        { k: "tay-nguyen", l: "Tây Nguyên" },
        { k: "mien-nam", l: "Miền Nam" },
      ];
      const TYPES = [
        { k: "bien-dao", l: "Biển đảo" },
        { k: "nui-rung", l: "Núi rừng" },
      ];

      /* Tháng hiện tại theo giờ Việt Nam (CBR 9) */
      const realMonth = +new Intl.DateTimeFormat("en", {
        month: "numeric",
        timeZone: "Asia/Ho_Chi_Minh",
      }).format(new Date());
      const ovr = +P.get("thang");
      const nowMonth = ovr >= 1 && ovr <= 12 ? ovr : USE_MOCK ? 10 : realMonth;
      const nextMonth = (nowMonth % 12) + 1;

      /* ===== Chuẩn hóa dữ liệu API (chịu được snake_case / camelCase) ===== */
      function normRegion(v) {
        const s = fold(v);
        if (s.includes("tay nguyen") || s.includes("highland"))
          return "tay-nguyen";
        if (s.includes("trung") || s.includes("central")) return "mien-trung";
        if (s.includes("bac") || s.includes("north")) return "mien-bac";
        if (s.includes("nam") || s.includes("south")) return "mien-nam";
        return "";
      }
      function normType(v, tags) {
        const s = fold([v, ...(tags || [])].join(" "));
        if (/bien|dao|beach|island|sea/.test(s)) return "bien-dao";
        if (/nui|rung|trekking|mountain|forest/.test(s)) return "nui-rung";
        return "";
      }
      function months(v) {
        let a = Array.isArray(v) ? v : String(v || "").split(/[,\s]+/);
        return [...new Set(a.map(Number).filter((n) => n >= 1 && n <= 12))];
      }
      function fmtMonths(a) {
        const set = new Set(a);
        if (set.size === 12) return "Quanh năm";
        if (!set.size) return "—";
        const out = [];
        for (let s = 1; s <= 12; s++) {
          if (set.has(s) && !set.has(((s + 10) % 12) + 1)) {
            let e = s;
            while (set.has((e % 12) + 1)) e = (e % 12) + 1;
            out.push(s === e ? "T" + s : `T${s} – T${e}`);
          }
        }
        return out.join(", ");
      }
      function fmtDays(v) {
        if (typeof v === "string" && v.trim()) return v;
        const n = +v;
        return n ? (n === 1 ? "1 ngày" : `${n}N${n - 1}Đ`) : "—";
      }
      const REGION_ENUM = {
        NORTH: "mien-bac",
        CENTRAL: "mien-trung",
        HIGHLANDS: "tay-nguyen",
        SOUTH: "mien-nam",
      }; // khớp REGIONS của destinationCatalog.service.js
      const CATEGORY_ENUM = { BEACH: "bien-dao", MOUNTAIN: "nui-rung" }; // CULTURE không có chip riêng
      function norm(d) {
        const tags = (d.tags || [])
          .map((t) => (typeof t === "string" ? t : t.name))
          .filter(Boolean);
        const best = months(d.best_months ?? d.bestMonths ?? d.good_months);
        return {
          slug: d.slug,
          name: d.name,
          province: d.province || "",
          region:
            REGION_ENUM[String(d.region).toUpperCase()] || normRegion(d.region),
          type: d.category
            ? CATEGORY_ENUM[String(d.category).toUpperCase()] || ""
            : normType(d.type, tags),
          tags: tags.slice(0, 2),
          best,
          days: fmtDays(
            d.days_label ??
              d.daysLabel ??
              d.suggested_days ??
              d.suggestedDays ??
              d.days,
          ),
          count:
            +(

      /* ===== Trạng thái ===== */
      let ALL = [];
      const st = { q: "", chip: "", sort: "lt" }; // chip: 'all' | key vùng | key loại (chọn một)
      const chipKeys = [...REGIONS, ...TYPES].map((x) => x.k);

      function readUrl() {
        const p = new URLSearchParams(location.search);
        st.q = (p.get("q") || "").slice(0, 100);
        const v = p.get("vung"),
          l = p.get("loai");
        st.chip = REGIONS.some((r) => r.k === v)
          ? v
          : TYPES.some((t) => t.k === l)
            ? l
            : "";
        st.sort = p.get("sapxep") === "ten" ? "ten" : "lt";
        $("#q").value = st.q;
        $("#sort").value = st.sort;
      }
      function writeUrl() {
        const p = new URLSearchParams(location.search);
        ["q", "vung", "loai", "sapxep"].forEach((k) => p.delete(k));
        if (st.q) p.set("q", st.q);
        if (REGIONS.some((r) => r.k === st.chip)) p.set("vung", st.chip);
        if (TYPES.some((t) => t.k === st.chip)) p.set("loai", st.chip);
        if (st.sort !== "lt") p.set("sapxep", st.sort);
        const s = p.toString();
        history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
      }

      /* ===== Hiển thị ===== */
      function matchQ(d) {
        if (!st.q) return true;
        const q = fold(st.q);
        const rl = (REGIONS.find((r) => r.k === d.region) || {}).l || "";
        return (
          fold(d.name).includes(q) ||
          fold(d.province).includes(q) ||
          fold(rl).includes(q)
        );
      } // BR 30
      function card(d) {
        const rl = (REGIONS.find((r) => r.k === d.region) || {}).l;
        return `<a class="card" href="${ROUTES.detail(d.slug)}">
  <div class="c-img">${imgTag(d)}${rl ? `<span class="pill reg">${rl}</span>` : ""}${d.best.includes(nowMonth) ? '<span class="pill now">Đang vào mùa</span>' : ""}</div>
  <div class="c-body"><h3>${esc(d.name)}</h3><p class="prov">${esc(d.province)}</p>
  <ul class="tags">${d.tags.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
  <dl class="stats"><div><dt>Hợp đi</dt><dd>${fmtMonths(d.best)}</dd></div><div><dt>Đi mấy ngày</dt><dd>${esc(d.days)}</dd></div><div><dt>Lịch trình</dt><dd>${d.count.toLocaleString("vi-VN")}</dd></div></dl></div></a>`;
      } // BR 29

      function renderSeason() {
        const box = $("#season");
        const pick = ALL.filter(
          (d) => d.best.includes(nowMonth) || d.best.includes(nextMonth),
        )
          .sort(
            (a, b) =>
              b.best.includes(nowMonth) - a.best.includes(nowMonth) ||
              a.best.length - b.best.length ||
              b.count - a.count,
          )
          .slice(0, 3); // BR 28
        box.hidden = !pick.length;
        if (!pick.length) return;
        $("#sTitle").textContent =
          `Tháng ${nowMonth}, ${nextMonth} nên đi đâu?`;
        $("#sGrid").innerHTML = pick
          .map(
            (
              d,
            ) => `<a class="s-card" href="${ROUTES.detail(d.slug)}">${imgTag(d)}<div>
    <span class="tag-reason">${esc(d.reason || (d.best.includes(nowMonth) ? "Đang vào mùa" : "Sắp vào mùa"))}</span>
    <h3>${esc(d.name)}</h3><p>${esc(d.note.length > 90 ? d.note.slice(0, 87) + "…" : d.note)}</p></div></a>`,
          )
          .join("");

      function renderChips() {
        const base = ALL.filter(matchQ);
        const cnt = (k) => base.filter((d) => d.region === k).length;
        const mk = (k, l, c) =>
          `<button type="button" class="chip" data-k="${k}" aria-pressed="${(st.chip || "all") === k}">${l}${c == null ? "" : " · " + c}</button>`;
        $("#chips").innerHTML =
          mk("all", "Tất cả", base.length) +
          REGIONS.map((r) => mk(r.k, r.l, cnt(r.k))).join("") +
          TYPES.map((t) => mk(t.k, t.l)).join("");
      } // BR 31

        let list = ALL.filter(matchQ).filter(
          (d) => !st.chip || d.region === st.chip || d.type === st.chip,

        list.sort(
          st.sort === "ten"
            ? (a, b) => a.name.localeCompare(b.name, "vi")
            : (a, b) => b.count - a.count || a.name.localeCompare(b.name, "vi"),
        );
        const g = $("#grid");
        g.setAttribute("aria-busy", "false");
        g.innerHTML = list.length
          ? list.map(card).join("")

      /* ===== Tải dữ liệu (NFR 2: skeleton + dòng đánh thức máy chủ) ===== */
      async function load() {
        const g = $("#grid");
        g.setAttribute("aria-busy", "true");
        g.innerHTML = Array(8).fill('<div class="sk"></div>').join("");
        const wake = setTimeout(
          () =>
            g.insertAdjacentHTML(
              "afterbegin",
              '<p class="wake" role="status">Đang đánh thức máy chủ…</p>',
            ),
          2500,
        );
        try {
          let raw;
          if (USE_MOCK) raw = MOCK;
          else {
            const ctl = new AbortController(),
              to = setTimeout(() => ctl.abort(), 60000);
            const r = await fetch(
              API_BASE + "/api/public/destinations?size=100",
              {
                signal: ctl.signal,
                headers: { Accept: "application/json" },
              },
            );
            clearTimeout(to);
            if (!r.ok) throw new Error(r.status);
            const j = await r.json();
            raw = Array.isArray(j) ? j : j.items || j.content || j.data || [];
          }
          ALL = raw.map(norm).filter((d) => d.slug && d.name);
          renderSeason();
          update();
        } catch (e) {
          $("#season").hidden = true;
          $("#chips").innerHTML = "";
          g.setAttribute("aria-busy", "false");
          g.innerHTML =
            '<div class="state" role="alert"><p>Chưa tải được danh sách điểm đến. Kiểm tra kết nối rồi thử lại.</p><button class="btn" id="retry">Thử lại</button></div>';
          $("#retry").onclick = load;
        } finally {
          clearTimeout(wake);
        }

      /* ===== Header: khách / thành viên ===== */
      const getToken = () =>

      function dialog(msg, btns) {
        return new Promise((res) => {

          const row = $("#dlgBtns");

          d.oncancel = (e) => {
            if (btns.length < 2) e.preventDefault();
            else res(false);
          };
          d.showModal();

      function guestHeader() {
        $("#auth").innerHTML =

        document

          );

      function initials(n) {
        const w = fold(n).split(/\s+/).filter(Boolean);
        if (!w.length) return "TV";
        return (
          w[0][0] + (w.length > 1 ? w[w.length - 1][0] : "")
        ).toUpperCase();

      function memberHeader(name) {
        const a = $("#auth");
        a.innerHTML = `<button class="avatar" id="av" aria-haspopup="true" aria-expanded="false" aria-label="Menu tài khoản">${esc(initials(name))}</button>
  <div class="acc" id="acc" hidden><a href="${ROUTES.saved}">Đã lưu</a><button type="button" id="out">Đăng xuất</button></div>`;
        const av = $("#av"),
          acc = $("#acc");
        const close = () => {
          acc.hidden = true;
          av.setAttribute("aria-expanded", "false");
        };
        av.onclick = (e) => {
          e.stopPropagation();
          acc.hidden = !acc.hidden;
          av.setAttribute("aria-expanded", String(!acc.hidden));
        };
        document.addEventListener("click", close);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            close();
            av.focus();
          }
        });
        $("#out").onclick = async () => {
          close(); // UC 3, BR 11
          if (
            await dialog("Bạn có chắc muốn đăng xuất?", [
              { t: "Hủy", v: false, cls: "light" },
              { t: "Đăng xuất", v: true },

            localStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(TOKEN_KEY);
            location.href = ROUTES.home;
          }

      }
      async function initAuth() {
        const t = getToken();
        if (USE_MOCK && !P.has("khach")) return memberHeader("Duy Đỗ");
        if (!t) return guestHeader();
        try {
          const r = await fetch(API_BASE + "/api/auth/me", {
            headers: { Authorization: "Bearer " + t },
          });
          if (r.status === 401) {
            localStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(TOKEN_KEY); // BR 12
            await dialog(
              "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.",

            location.href = loginUrl();

          if (!r.ok) throw 0;
          const u = await r.json();
          memberHeader(
            u.name ||
              u.fullName ||

              u.username ||
              (u.email || "").split("@")[0],

        const n = $("#nav"),
          o = n.classList.toggle("open");
        e.currentTarget.setAttribute("aria-expanded", String(o));
      });
      document.addEventListener(
        "error",
        (e) => {
          const i = e.target;
          if (i.tagName === "IMG" && i.dataset.fb && i.src !== i.dataset.fb)
            i.src = i.dataset.fb;
        },
        true,
      );

      readUrl();
      initAuth();
      load();
    </script>
  </body>
</html>
